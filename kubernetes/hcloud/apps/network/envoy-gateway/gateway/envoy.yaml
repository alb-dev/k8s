
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: ClusterIP
      envoyDaemonSet:
        patch:
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  volumes:
                    - name: dynamic-modules
                      image:
                        reference: ghcr.io/tetratelabs/built-on-envoy/composer:0.6.0-dev
                        pullPolicy: IfNotPresent
                    - name: geoip-db
                      emptyDir: {}
                  initContainers:
                    - name: geoipupdate
                      image: ghcr.io/maxmind/geoipupdate:v7
                      env:
                        - name: GEOIPUPDATE_ACCOUNT_ID
                          valueFrom:
                            secretKeyRef:
                              name: maxmind-license
                              key: account_id
                        - name: GEOIPUPDATE_LICENSE_KEY
                          valueFrom:
                            secretKeyRef:
                              name: maxmind-license
                              key: license_key
                        - name: GEOIPUPDATE_EDITION_IDS
                          value: GeoLite2-Country
                        - name: GEOIPUPDATE_DB_DIR
                          value: /etc/envoy/geoip
                        - name: GEOIPUPDATE_FREQUENCY
                          value: "0"
                      volumeMounts:
                        - name: geoip-db
                          mountPath: /etc/envoy/geoip
        container:
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1Gi
          env:
            - name: GODEBUG
              value: "cgocheck=0"
          volumeMounts:
            - name: dynamic-modules
              mountPath: /etc/envoy/dynamic-modules
              readOnly: true
            - name: geoip-db
              mountPath: /etc/envoy/geoip
              readOnly: true
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
  dynamicModules:
    - name: composer
      source:
        type: Local
        local:
          path: /etc/envoy/dynamic-modules/libcomposer.so
      doNotClose: true
      loadGlobally: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy
spec:
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      connectionIdleTimeout: 15s
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  connection:
    bufferLimit: 8Mi
    maxAcceptPerSocketEvent: 0
  http2:
    initialStreamWindowSize: 2Mi
    initialConnectionWindowSize: 32Mi
    onInvalidMessage: TerminateStream
  tcpKeepalive: {}
  timeout:
    http:
      requestReceivedTimeout: 0s
  http3: {}
  #  Required for Collabora WebSocket paths with encoded URLs
  path:
    escapedSlashesAction: KeepUnchanged
    disableMergeSlashes: true
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  headers:
    earlyRequestHeaders:
      set:
        - name: X-Real-IP
          value: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: "%REQ(:authority)%"
        - name: X-Forwarded-Uri
          value: "%REQ(:path)%"
    lateResponseHeaders:
      remove:
       - "x-powered-by"
       - "x-xss-protection"
      set:
        - name: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains; preload
        - name: Referrer-Policy
          value: same-origin, strict-origin-when-cross-origin
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: server
          value: "albcloud"
        - name: X-Robots-tag
          value: "noindex, nofollow"

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: headscale-upgrade
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-external
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: network/envoy-external/https
      operation:
        op: add
        path: /filter_chains/0/filters/0/typed_config/upgrade_configs/-
        value:
          upgrade_type: tailscale-control-protocol

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: geoip-country
  namespace: network
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-external
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: network/envoy-external/https
      operation:
        op: add
        # Index 0 -> Filter laeuft vor dem Authz-Filter der SecurityPolicy
        path: /filter_chains/0/filters/0/typed_config/http_filters/0
        value:
          name: envoy.filters.http.geoip
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.geoip.v3.Geoip
            xff_config:
              xff_num_trusted_hops: 1
            provider:
              name: envoy.geoip_providers.maxmind
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.geoip_providers.maxmind.v3.MaxMindConfig
                common_provider_config:
                  geo_headers_to_add:
                    country: x-geo-country
                country_db_path: /etc/envoy/geoip/GeoLite2-Country.mmdb

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: geo-allowlist
  namespace: network
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  authorization:
    defaultAction: Deny
    rules:
      # 1. Vertrauenswuerdige IPs IMMER erlauben (vor GeoIP) — zuerst ausgewertet
      - name: allow-trusted-ips
        action: Allow
        principal:
          clientCIDRs:
            - 46.224.13.115/32 # albdev
            - 91.98.37.31/32 #sujiba
            - 10.0.0.0/8
            - 192.168.0.0/16
      - name: allow-dach
        action: Allow
        principal:
          headers:
            - name: x-geo-country
              values: ["DE", "AT", "CH"]