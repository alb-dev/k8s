---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./certificates.yaml
  - ./envoy.yaml
  - ./external.yaml
  - ./grafanadashboard.yaml
  - ./https-redirect.yaml
  - ./podmonitor.yaml
  - ./security-geoip.yaml
  - ./security-waf.yaml
  - ./secrets.sops.yaml
  
configMapGenerator:
  - name: envoy-external-extensions
    files:
      - resources/block-user-agents.lua
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled