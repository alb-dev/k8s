---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: externaldns-netcup
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: externaldns-netcup
  interval: 1h
  path: "./kubernetes/apps/network/external-dns/netcup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 5m
  wait: false