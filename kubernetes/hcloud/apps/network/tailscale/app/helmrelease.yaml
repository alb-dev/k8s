---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale
  interval: 1h
  values:
    controllers:
      tailscale:
        type: statefulset

        replicas: 1

        strategy: RollingUpdate

        serviceAccount:
          name: tailscale

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: v1.96.5
            env:
              HOME: /tmp
              NO_AUTOUPDATE: true
              TS_ENABLE_HEALTH_CHECK: true
              TS_ENABLE_METRICS: true
              TS_EXTRA_ARGS: >-
                --advertise-exit-node
                --login-server=https://headscale.albdev.cloud
              TS_STATE_DIR: /tmp
              TS_USERSPACE: true
            envFrom:
              - secretRef:
                  name: tailscale-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9002
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568

    service:
      app:
        controller: tailscale
        ports:
          http:
            port: 9002

    persistence:
      tmp:
        type: emptyDir

    serviceAccount:
      tailscale : {}

    rbac:
      bindings:
        tailscale:
          type: RoleBinding
          roleRef:
            kind: Role
            name: tailscale
          subjects:
            - identifier: tailscale
      roles:
        tailscale:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - tailscale
                - tailscale-secret
                - tailscale-auth
                - tailscale-state
              verbs:
                - create
                - get
                - update
                - patch
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - get
                - create
                - patch