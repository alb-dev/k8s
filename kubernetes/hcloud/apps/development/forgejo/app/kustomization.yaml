---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: development

resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./envoyextensionpolicy.yaml

configMapGenerator:
  - name: envoy-external-extensions
    files:
      - resources/block-user-agents.lua
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled