---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  interval: 1h
  path: ./kubernetes/hcloud/apps/ai/litellm/app
  components:
    - ../../../../components/dragonfly
  postBuild:
    substitute:
      APP: litellm
      DRAGONFLY_REPLICAS: "1"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai