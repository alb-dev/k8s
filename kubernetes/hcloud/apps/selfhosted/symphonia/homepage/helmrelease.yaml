---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: symphonia-homepage
spec:
  chartRef:
    kind: OCIRepository
    name: symphonia-homepage
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
 
    controllers:
      symphonia-homepage:
        replicas: 2
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: code.albdev.cloud/lab/container-images/symphonia-homepage
              tag: 0.1.0
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 100Mi

    service:
      app:
        controller: symphonia-homepage
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames: ["symphonia-homepage.${CLUSTER_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https

    rules:
      - backendRefs:
          - identifier: app
            port: 8080
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: X-Robots-Tag
                  value: ""
                  
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi