---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-collabora
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: collabora
  values:
    controllers:
      collabora:
        pod:
          hostUsers: false
        containers:
          app:
            image:
              repository: collabora/code
              tag: 26.04.2.2.1@sha256:f8a308bcd12ad09babcd635662b512776b0749fc04c9a63db568865bd195b4d9
            resources:
              requests:
                cpu: 150m
                memory: 768Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: Unconfined
              capabilities:
                drop:
                  - ALL
            env:
              extra_params: --o:ssl.termination=true --o:ssl.enable=false --o:security.capabilities=false --o:logging.level=error
              aliasgroup1: https://files.albdev.cloud:443
              domain: files\\.albdev\\.cloud

    service:
      app:
        ports:
          http:
            port: 9980
            
    route:
      app:
        hostnames:
          - collabora.albdev.cloud
        parentRefs:
          - name: envoy-external
            namespace: network