---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./extensionpolicy.yaml

configMapGenerator:
  - name: envoy-external-extensions
    files:
      - resources/block-user-agents.lua
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled