---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: rustfs-s3-service
  namespace: network
spec:
  endpoints:
    - ip:
        address: "${SECRET_MEDIA_SERVER}"
        port: 9000
#  tls:
#    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustf-s3-service
spec:
  hostnames: ["s3.${CLUSTER_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: rustfs-s3-service
      matches:
        - path:
            type: PathPrefix
            value: /

